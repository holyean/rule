name: Update CN Direct Rules

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build consolidated rule set
        run: ./scripts/build-cn-direct.sh

      - name: Commit changes when sources changed
        run: |
          if git diff --quiet -- surge/cn-direct.list; then
            exit 0
          fi
          git config user.name "holyean-rule-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add surge/cn-direct.list
          git commit -m "chore: update CN direct rules"
          git push
