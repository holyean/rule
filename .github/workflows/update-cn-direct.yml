name: Update Surge Rule Libraries

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build consolidated rule sets
        run: |
          ./scripts/build-cn-direct.sh
          ./scripts/build-global-proxy.sh

      - name: Commit changes when sources changed
        run: |
          if git diff --quiet -- surge/cn-direct.list surge/global-proxy.list; then
            exit 0
          fi
          git config user.name "holyean-rule-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add surge/cn-direct.list surge/global-proxy.list
          git commit -m "chore: update Surge rule libraries"
          git push
